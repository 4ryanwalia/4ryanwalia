name: Spotify card (fallback)

# The escape hatch, not the live card.
#
# The README points at the Vercel endpoint in spotify-live/, which asks Spotify
# at the moment someone loads the profile. This workflow renders the same card
# into ./assets and rewrites the README block to use those files instead —
# which is what you want if the endpoint ever has to be abandoned, and nothing
# you want happening behind your back while the endpoint is healthy.
#
# So: no cron. Scheduled runs would quietly overwrite the live card with a
# static one every five minutes, and the static one can only be as fresh as
# GitHub's scheduler, which queues on shared runners and routinely lands 15-40
# minutes apart. Run it by hand from the Actions tab when you actually want it.
#
# The refresh token lives in this repository's secrets and is read only by the
# stdlib script in scripts/. Nothing is sent to a third-party service, and the
# job installs no packages — there is no supply chain between the token and
# the API call.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ask Spotify what is playing
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python scripts/spotify_card.py

      - name: Commit only if the track actually changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change — skipping commit."
            exit 0
          fi
          # Authored by the bot on purpose: a card refresh is not a
          # contribution and has no business colouring the contribution graph.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(spotify): refresh now-playing card"
          git push
